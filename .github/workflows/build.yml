name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Build debug APK
        run: |
          # Retry x3 : les échecs réseau vers dl.google.com sont
          # occasionnels sur les runners GitHub hébergés.
          ok=0
          for i in 1 2 3; do
            gradle assembleDebug --no-daemon --stacktrace && ok=1 && break
            echo "Tentative $i échouée, nouvelle tentative..."
            sleep 10
          done
          [ $ok -eq 1 ]

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gempicker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
