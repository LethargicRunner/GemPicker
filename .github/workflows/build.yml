name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Les runners GitHub ont déjà le SDK Android préinstallé
      # (/usr/local/lib/android/sdk) avec les licences acceptées :
      # pas besoin d'action de setup SDK.

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gempicker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
